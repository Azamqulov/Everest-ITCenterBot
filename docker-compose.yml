version: '3.8'

services:
  bot:
    build: .
    container_name: everest_bot
    restart: always
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./media:/app/media
      - ./exports:/app/exports
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: everest_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
